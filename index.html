<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Calculator</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="calculator">

        <h1>Calculator</h1>

        <!-- Display Screen -->
        <div class="display">
            <div id="expression"></div>
            <input type="text" id="result" value="0" readonly>
        </div>

        <!-- Calculator Buttons -->
        <div class="buttons">

            <button class="clear" data-action="clear">AC</button>
            <button class="delete" data-action="delete">DEL</button>
            <button class="operator" data-operator="%">%</button>
            <button class="operator" data-operator="/">÷</button>

            <button data-number="7">7</button>
            <button data-number="8">8</button>
            <button data-number="9">9</button>
            <button class="operator" data-operator="*">×</button>

            <button data-number="4">4</button>
            <button data-number="5">5</button>
            <button data-number="6">6</button>
            <button class="operator" data-operator="-">−</button>

            <button data-number="1">1</button>
            <button data-number="2">2</button>
            <button data-number="3">3</button>
            <button class="operator" data-operator="+">+</button>

            <button data-action="sign">+/-</button>
            <button data-number="0">0</button>
            <button data-action="decimal">.</button>
            <button class="equal" data-action="equals">=</button>

        </div>

        <p class="footer">Created by Sruthi | CodeAlpha Internship</p>

    </div>

    <script src="script.js"></script>

</body>
</html>
